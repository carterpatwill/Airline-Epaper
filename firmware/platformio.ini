; reTerminal E1001 — "Closest Plane Overhead" firmware
; ESP32-S3 (XIAO-S3 core) + 7.5" GDEY075T7 ePaper (UC8179) via Seeed_GxEPD2.
; See ../HARDWARE.md for the full pin map and board notes.

[env:reterminal_e1001]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; 32MB flash (E1001) with a custom partition table: 4MB app + ~28MB LittleFS.
; LittleFS holds acdb.bin (aircraft DB). Upload it with: pio run -t uploadfs
board_upload.flash_size = 32MB
board_build.flash_size = 32MB
board_build.partitions = partitions_e1001.csv
board_build.filesystem = littlefs

; Serial monitor. The board enumerates as /dev/tty.wchusbserial* on this Mac;
; PlatformIO auto-detects the port, but you can pin it if needed:
; upload_port = /dev/tty.wchusbserial110
; monitor_port = /dev/tty.wchusbserial110
monitor_speed = 115200

; OPI PSRAM (8MB) is present on the E1001 module.
build_flags =
    -DBOARD_HAS_PSRAM
    ; Route Serial to the UART0/CH34x chip (the USB-C port), not native USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; src/ is split into modules by concern; add each folder so the short
    ; #include "foo.h" form resolves regardless of which folder it lives in.
    -I src/core
    -I src/display
    -I src/geo
    -I src/net
    -I src/data
    -I src/ui
    -I src/generated
board_build.arduino.memory_type = qio_opi

lib_deps =
    ; Seeed's GxEPD2 fork — has the GDEY075T7 / UC8179 panel + E1001 Gray4 example.
    https://github.com/Seeed-Projects/Seeed_GxEPD2.git
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson
