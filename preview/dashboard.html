<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=800, initial-scale=1" />
<title>Closest Aircraft</title>
<style>
  /* ---- E-paper aesthetic: pure black on white, no gradients/shadows,
         high contrast, big legible type, fixed 800x480 panel. ---------- */
  :root { --ink:#000; --paper:#fff; --mute:#000; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #888;   /* gray = "off panel" area */
    font-family: "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: none; font-smooth: never;
  }
  /* The physical e-paper panel */
  #panel {
    width: 800px; height: 480px; margin: 0 auto;
    background: var(--paper); color: var(--ink);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* Header strip */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px 8px; border-bottom: 3px solid var(--ink);
    flex: none;
  }
  header .flight { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
  header .airline { font-size: 18px; font-weight: 600; }
  header .clock { font-size: 16px; font-weight: 600; text-align: right; }

  /* Top white buttons: DETAILS / MAP screen switcher */
  .tabs { display: flex; gap: 0; }
  .tab {
    font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); padding: 8px 16px;
    -webkit-font-smoothing: none;
  }
  .tab + .tab { border-left: none; }
  .tab.active { background: var(--ink); color: var(--paper); }  /* inverted = selected */

  /* Screen container: DETAILS and MAP swap in here */
  #screens { position: relative; flex: 1; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: block; }

  /* Body: route + silhouette on the left, stats on the right */
  .body { display: flex; height: calc(100% - 62px); }

  .left { flex: 1.4; padding: 18px 22px; border-right: 3px solid var(--ink);
          display: flex; flex-direction: column; }

  /* Route line: LAX  vv------>  ORD */
  .route { display: flex; align-items: center; justify-content: space-between; }
  .route .code { font-size: 58px; font-weight: 800; line-height: 1; }
  .route .arrow { flex: 1; text-align: center; font-size: 22px; position: relative;
                  padding: 0 10px; }
  .route .arrow .line { border-top: 3px solid var(--ink); margin: 14px 4px 6px; }
  .route .arrow .plane { font-size: 24px; }
  .route .city { font-size: 16px; font-weight: 600; max-width: 150px; }
  .route .city.right { text-align: right; }
  .cities { display: flex; justify-content: space-between; margin-top: 2px; }

  .silhouette { flex: 1; display: flex; align-items: center; justify-content: center;
                margin-top: 10px; }
  .silhouette img { max-height: 130px; max-width: 100%;
                    filter: grayscale(1) contrast(1.4); }

  .typeline { text-align: center; font-size: 18px; font-weight: 700;
              margin-top: 4px; }

  /* Right column: the numbers */
  .right { flex: 1; padding: 12px 20px; display: flex; flex-direction: column;
           justify-content: space-between; }
  .stat { }
  .stat .label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
                 text-transform: uppercase; border-bottom: 1px solid var(--ink);
                 padding-bottom: 2px; }
  .stat .value { font-size: 38px; font-weight: 800; line-height: 1.1; }
  .stat .value small { font-size: 18px; font-weight: 600; }

  /* Footer: where to look (details screen only) */
  .footer {
    position: absolute; bottom: 0; left: 0; right: 0; height: 62px;
    border-top: 3px solid var(--ink); display: flex; align-items: center;
    justify-content: space-between; padding: 0 22px; font-weight: 700;
  }
  .footer .look { font-size: 24px; }
  .footer .compass { font-size: 40px; display: inline-block; }
  .footer .dist { font-size: 22px; }

  /* ---- MAP SCREEN: you in the center, plane placed by bearing + distance --- */
  #screenMap { overflow: hidden; }
  .mapbg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; filter: grayscale(1) contrast(1.1) brightness(1.08);
  }
  #rings { position: absolute; inset: 0; width: 100%; height: 100%;
           pointer-events: none; }
  #rings circle { fill: none; stroke: #000; stroke-width: 1.5;
                  stroke-dasharray: 4 5; opacity: .55; }
  #rings line { stroke: #000; stroke-width: 1.5; stroke-dasharray: 4 5; opacity: .45; }
  .ringlabel { position: absolute; font-size: 11px; font-weight: 800;
               background: var(--paper); color: var(--ink); padding: 0 3px;
               transform: translate(-50%, -50%); border: 1px solid var(--ink); }

  /* YOU marker */
  #youDot { position: absolute; width: 16px; height: 16px; border-radius: 50%;
            background: var(--ink); border: 3px solid var(--paper);
            transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--ink); }
  #youLabel { position: absolute; font-size: 12px; font-weight: 800;
              letter-spacing: 1px; transform: translate(-50%, 0);
              background: var(--paper); border: 2px solid var(--ink);
              padding: 1px 5px; }

  /* PLANE marker on the map */
  #planeMarker { position: absolute; transform: translate(-50%, -50%);
                 display: flex; flex-direction: column; align-items: center;
                 pointer-events: none; }
  #planeMarker .glyph { font-size: 40px; line-height: 1; color: var(--ink);
                        text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper); }
  #planeMarker .tag { margin-top: 2px; font-size: 12px; font-weight: 800;
                      background: var(--ink); color: var(--paper);
                      padding: 1px 5px; white-space: nowrap; }

  /* North indicator */
  #northInd { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
              font-size: 13px; font-weight: 800; letter-spacing: 1px;
              background: var(--paper); border: 2px solid var(--ink);
              padding: 1px 7px; }

  /* Map bottom info strip */
  .mapstrip {
    position: absolute; bottom: 0; left: 0; right: 0; height: 46px;
    border-top: 3px solid var(--ink); background: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; font-weight: 700; }
  .mapstrip .big { font-size: 22px; }
  .mapstrip .sub { font-size: 16px; }

  .stale { opacity: .35; }
</style>
</head>
<body>
<div id="panel">
  <header>
    <div>
      <div class="flight" id="flight">UAL1234</div>
      <div class="airline" id="airline">United Airlines</div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabDetails" onclick="showScreen('details')">Details</button>
      <button class="tab" id="tabMap" onclick="showScreen('map')">Map</button>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div id="screens">

    <!-- ======================= SCREEN 1: DETAILS ======================= -->
    <div class="screen active" id="screenDetails">
      <div class="body">
        <div class="left">
          <div class="route">
            <div class="code" id="orig">LAX</div>
            <div class="arrow">
              <div class="plane">&#9992;</div>
              <div class="line"></div>
            </div>
            <div class="code" id="dest">ORD</div>
          </div>
          <div class="cities">
            <div class="city" id="origCity">Los Angeles</div>
            <div class="city right" id="destCity">Chicago</div>
          </div>

          <div class="silhouette">
            <img id="silhouette" src="/img/NarrowBody_e1001.png" alt="">
          </div>
          <div class="typeline" id="type">Boeing 737-800</div>
        </div>

        <div class="right">
          <div class="stat">
            <div class="label">Altitude</div>
            <div class="value"><span id="alt">32,000</span> <small>ft <span id="climb">&#8593;</span></small></div>
          </div>
          <div class="stat">
            <div class="label">Ground Speed</div>
            <div class="value"><span id="spd">458</span> <small>kt</small></div>
          </div>
          <div class="stat">
            <div class="label">Heading</div>
            <div class="value"><span id="hdg">067</span><small>&deg;</small></div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="look">Look <span id="dir">ENE</span> <span class="compass" id="compass" style="transform:rotate(67deg)">&#8593;</span></div>
        <div class="dist"><span id="elev">28</span>&deg; up &nbsp;&middot;&nbsp; <span id="dist">3.2</span> km away</div>
      </div>
    </div>

    <!-- ========================= SCREEN 2: MAP ========================= -->
    <div class="screen" id="screenMap">
      <img class="mapbg" src="../assets/map/SanFranGrey.png" alt="">
      <svg id="rings"></svg>
      <div id="northInd">N &#8593;</div>
      <div id="youDot"></div>
      <div id="youLabel">YOU</div>
      <div id="planeMarker">
        <div class="glyph" id="planeGlyph">&#9992;</div>
        <div class="tag" id="planeTag">UAL1234</div>
      </div>
      <div class="mapstrip">
        <div class="big"><span id="mDist">3.2</span> km &nbsp;&middot;&nbsp; Look <span id="mDir">ENE</span></div>
        <div class="sub"><span id="mAlt">32,000</span> ft &nbsp;&middot;&nbsp; <span id="mElev">28</span>&deg; up</div>
      </div>
    </div>

  </div>
</div>

<script>
// ---- Helpers ---------------------------------------------------------------
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE',
                 'S','SSW','SW','WSW','W','WNW','NW','NNW'];
function compass(deg){ return COMPASS[Math.round(((deg%360)/22.5))%16]; }

// Elevation angle above the horizon: atan(altitude / ground distance).
function elevationDeg(altFt, distKm){
  const altKm = altFt * 0.0003048;
  if (distKm <= 0) return 90;
  return Math.round(Math.atan2(altKm, distKm) * 180 / Math.PI);
}

function setText(id, v){ document.getElementById(id).textContent = v; }

// ---- Screen switching (top white buttons) ----------------------------------
let currentScreen = 'details';
let lastPlane = null;
function showScreen(which){
  currentScreen = which;
  document.getElementById('screenDetails').classList.toggle('active', which==='details');
  document.getElementById('screenMap').classList.toggle('active', which==='map');
  document.getElementById('tabDetails').classList.toggle('active', which==='details');
  document.getElementById('tabMap').classList.toggle('active', which==='map');
  if (which==='map') drawMap();   // map needs real element sizes -> draw when visible
}

// ---- MAP drawing: you at center, plane placed by bearing + distance --------
const MAX_RANGE_KM = 10;                 // outer ring
const RING_KM = [2.5, 5, 7.5, 10];       // ring radii in km
function drawMap(){
  const map = document.getElementById('screenMap');
  const w = map.clientWidth, h = map.clientHeight;
  if (!w || !h) return;
  const cx = w/2, cy = (h - 46)/2;                 // center above the info strip
  const maxR = Math.min(cx, cy) - 24;

  // Range rings + tick labels
  const svg = document.getElementById('rings');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  document.querySelectorAll('.ringlabel').forEach(n => n.remove());
  let rings = '';
  rings += `<line x1="${cx}" y1="${cy-maxR}" x2="${cx}" y2="${cy+maxR}"/>`;
  rings += `<line x1="${cx-maxR}" y1="${cy}" x2="${cx+maxR}" y2="${cy}"/>`;
  RING_KM.forEach(km => {
    const r = (km/MAX_RANGE_KM)*maxR;
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
    const lbl = document.createElement('div');
    lbl.className = 'ringlabel';
    lbl.textContent = km + 'km';
    lbl.style.left = cx + 'px';
    lbl.style.top  = (cy - r) + 'px';
    map.appendChild(lbl);
  });
  svg.innerHTML = rings;

  // YOU marker
  const you = document.getElementById('youDot');
  you.style.left = cx + 'px'; you.style.top = cy + 'px';
  const yl = document.getElementById('youLabel');
  yl.style.left = cx + 'px'; yl.style.top = (cy + 14) + 'px';

  // Plane marker: bearing FROM you -> angle, distance -> radius
  const p = lastPlane || {};
  const brgDeg = (p.bearing != null ? p.bearing : (p.track || 0));
  const brg = brgDeg * Math.PI / 180;
  const distKm = Math.min(p.dist != null ? p.dist : 0, MAX_RANGE_KM);
  const r = (distKm / MAX_RANGE_KM) * maxR;
  const px = cx + r * Math.sin(brg);
  const py = cy - r * Math.cos(brg);
  const marker = document.getElementById('planeMarker');
  marker.style.left = px + 'px'; marker.style.top = py + 'px';
  // rotate the plane glyph to its heading (glyph points up = north at 0deg)
  document.getElementById('planeGlyph').style.transform = `rotate(${p.track||0}deg)`;
  setText('planeTag', p.callsign || '—');
}

function render(p){
  lastPlane = p;
  setText('flight', p.callsign || '—');
  setText('airline', p.airline || (p.type ? '' : '—'));
  setText('type', p.typeName || p.type || 'Unknown aircraft');

  // Route: "ORIG->DEST" from the API, or split fields if you enrich later.
  let orig = '—', dest = '—';
  if (p.route && p.route.includes('->')) {
    [orig, dest] = p.route.split('->');
  }
  setText('orig', orig);
  setText('dest', dest);
  setText('origCity', p.origCity || '');
  setText('destCity', p.destCity || '');

  setText('alt', p.ground ? 'GND' : (p.alt||0).toLocaleString());
  document.getElementById('climb').innerHTML =
    p.vrate > 150 ? '&#8593;' : p.vrate < -150 ? '&#8595;' : '&#8594;';
  setText('spd', p.spd || 0);
  setText('hdg', String(p.track||0).padStart(3,'0'));

  const elev = elevationDeg(p.alt||0, p.dist||1);
  setText('elev', elev);
  setText('dist', p.dist);
  setText('dir', compass(p.track||0));
  document.getElementById('compass').style.transform = `rotate(${p.track||0}deg)`;

  if (p.base_img) document.getElementById('silhouette').src = p.base_img;

  // Mirror key numbers onto the map strip
  setText('mDist', p.dist);
  setText('mDir', compass(p.bearing != null ? p.bearing : (p.track||0)));
  setText('mAlt', p.ground ? 'GND' : (p.alt||0).toLocaleString());
  setText('mElev', elev);

  const now = new Date();
  setText('clock', now.toTimeString().slice(0,5));
  document.getElementById('panel').classList.remove('stale');

  if (currentScreen === 'map') drawMap();
}

// ---- Live data: pick the CLOSEST plane (planes[0], API sorts by distance) --
async function refresh(){
  try {
    const res = await fetch('/api/planes');
    const data = await res.json();
    const airborne = (data.planes||[]).filter(p => !p.ground);
    if (airborne.length) render(airborne[0]);
    else document.getElementById('panel').classList.add('stale');
  } catch (e) {
    // Standalone preview mode (no server): use the sample card values.
    render({
      callsign:'UAL1234', airline:'United Airlines', typeName:'Boeing 737-800',
      route:'LAX->ORD', origCity:'Los Angeles', destCity:'Chicago',
      alt:32000, vrate:300, spd:458, track:67, bearing:67, dist:3.2
    });
    document.getElementById('panel').classList.add('stale');
  }
}

refresh();
setInterval(refresh, 15000);
window.addEventListener('resize', () => { if (currentScreen==='map') drawMap(); });
</script>
</body>
</html>
